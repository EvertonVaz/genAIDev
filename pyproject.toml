[project]
name = "src"
version = "0.1.0"
description = "42 São Paulo: Imersão GenAI para Desenvolvedores"
authors = [
    {name = "Everton",email = "egeraldo@student.42sp.org.br"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"

dependencies = [
    "taskipy (>=1.14.1,<2.0.0)",
    "google-genai (>=1.46.0,<2.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "streamlit (>=1.50.0,<2.0.0)",
    "chromadb (>=1.2.1,<2.0.0)",
    "sentence-transformers (>=5.1.2,<6.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "*", from = "src"}]

[tool.taskipy.tasks]
run = "clear && streamlit run /usr/src/rush_genai/main.py"
